services:
  deck-creator:
    image: ghcr.io/zboinek/deck-creator:latest
    container_name: deck-creator
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./deck-creator/decks:/app/decks:ro
      - ./deck-creator/podcasts:/app/podcasts:ro
      - deck-creator-data:/app/data
    environment:
      - STATS_USER=${STATS_USER:-admin}
      - STATS_PASSWORD=${STATS_PASSWORD:-}

volumes:
  deck-creator-data:
