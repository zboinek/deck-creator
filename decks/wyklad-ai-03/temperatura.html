<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Temperatura</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  .main { gap: 30px; align-items: stretch; }
  .col { flex: 1; padding: 26px 28px; display: flex; flex-direction: column; gap: 11px; }
  .col .t { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700; }
  .col .d { font-size: 19px; color: var(--muted); margin-bottom: 4px; }
  /* skala: 1% = 3.4 px, więc 100% = 340 px (pełna szerokość toru) */
  .row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 12px; }
  .tok { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; text-align: right; white-space: nowrap; }
  .track { display: flex; align-items: center; gap: 10px; }
  .bar { height: 24px; border-radius: 0 5px 5px 0; background: var(--line-strong); }
  .row.top .bar { background: var(--grad-bar); }
  .row.rest .tok { color: var(--dim); font-weight: 500; }
  .row.rest .bar { background: repeating-linear-gradient(-45deg, #ffffff 0 7px, #e4e4e7 7px 14px); border: 1px solid var(--line-strong); }
  .pct { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--muted); white-space: nowrap; }
  .draws { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
  .draws .h { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: #fff; border: 1.5px solid var(--line-strong); white-space: nowrap; }
  .chip.top { border: 2px solid transparent; background: linear-gradient(#fff, #fff) padding-box, var(--grad-bar) border-box; }
  .chip.rest { color: var(--muted); background: repeating-linear-gradient(-45deg, #ffffff 0 6px, #f0f0f2 6px 12px); border-style: dashed; }
  .verdict { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); font-size: 20px; font-weight: 600; }
</style>
</head>
<body>
  <div class="eyebrow">Temperatura</div>
  <h1>Ten sam model, to samo zdanie, inne losowanie</h1>
  <div class="thesis">Temperatura <b>zmienia rozkład</b>, a przez to <b>wypadają inne słowa</b>. Wiedza modelu zostaje ta sama.</div>
  <div class="main" id="m"></div>
  <div class="footer">
    <div class="note">„Dawno, dawno ...” z W9, reszta słownika: 19 tokenów po 1%. Losowania przykładowe, zgodne z procentami.</div>
    <div class="rule">p<sub>T</sub> ∝ p<sup>1/T</sup></div>
  </div>
<script>
  const toks = ['temu', ', raz', ', kiedy', ', gdy', ', na świecie', ', w krainie'];
  // policzone: p^(1/T) / suma, p = [42,19,8,5,4,3] + 19 × 1
  const cols = [
    { t: 'T = 0,3', d: 'niska: powtarzalnie, do ekstrakcji i kodu', v: [92.9, 6.6, 0.4, 0.1, 0.0, 0.0], r: 0.0, verdict: 'Powtarzalnie. Ekstrakcja, klasyfikacja, kod.', hi: true,
      s: ['temu','temu','temu','temu',', raz','temu','temu','temu','temu','temu'] },
    { t: 'T = 1', d: 'rozkład, jakiego model się nauczył', v: [42, 19, 8, 5, 4, 3], r: 19, verdict: 'Domyślnie w wielu czatach.',
      s: ['temu',', raz','temu',', kiedy','temu',', za górami','temu',', raz',', gdy',', pewien'] },
    { t: 'T = 1,5', d: 'wysoka: różnorodnie, ale i bzdury', v: [24.3, 14.3, 8.0, 5.9, 5.1, 4.2], r: 38.2, verdict: 'Różnorodnie, ale rośnie ryzyko bzdur.',
      s: [', kiedy',' lodówka','temu',', gdy',', za górami',', raz',' Excel','temu',', na świecie',' i jeszcze'] },
  ];
  const f = x => (x < 0.05 ? '<0,1' : x.toFixed(x >= 10 ? 0 : 1).replace('.', ',')) + '%';
  document.getElementById('m').innerHTML = cols.map(c => `
    <div class="card ${c.hi ? 'hi' : ''} col">
      <div class="t ${c.hi ? 'gt' : ''}" style="width:fit-content">${c.t}</div>
      <div class="d">${c.d}</div>
      ${c.v.map((p, i) => `<div class="row ${i ? '' : 'top'}"><div class="tok">${toks[i]}</div><div class="track"><div class="bar" style="width:${Math.max(p * 3.4, 2)}px"></div><div class="pct">${f(p)}</div></div></div>`).join('')}
      <div class="row rest"><div class="tok">reszta</div><div class="track"><div class="bar" style="width:${Math.max(c.r * 3.4, 2)}px"></div><div class="pct">${f(c.r)}</div></div></div>
      <div class="draws"><div class="h">10 losowań</div><div class="chips">${c.s.map(w => `<span class="chip ${w === 'temu' ? 'top' : toks.includes(w) ? '' : 'rest'}">${w}</span>`).join('')}</div></div>
    </div>`).join('');
</script>
</body>
</html>
