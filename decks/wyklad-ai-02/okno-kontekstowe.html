<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Okno kontekstowe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  body { padding: 36px 64px 28px; }
  h1 { font-size: 40px; margin-top: 8px; }
  .main { gap: 28px; margin-top: 16px; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ttl { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .chat { font-size: 19.5px; line-height: 1.3; }
  .m { padding: 4px 12px; }
  .m b { font-weight: 700; }
  .win { border: 3px solid transparent; border-radius: 12px; background: linear-gradient(#fff, #fff) padding-box, var(--grad-bar) border-box; padding: 5px 0; }
  .outside { color: #a1a1aa; }
  .new { color: var(--muted); }
  .callout { font-size: 20px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="eyebrow">Okno kontekstowe</div>
  <h1>Model widzi tylko to, co mieści się w oknie</h1>
  <div class="main">
    <div class="col">
      <div class="ttl">Tura 5: cała rozmowa jest w oknie</div>
      <div class="chat" id="a"></div>
    </div>
    <div class="col">
      <div class="ttl">Tura 6: okno przesunęło się w dół</div>
      <div class="chat" id="b"></div>
    </div>
  </div>
  <div class="callout">Numer klienta <b>1337</b> i zgłoszenie „Baza danych nie działa” są już poza oknem. <b>Dla modelu tych informacji nie ma.</b></div>
<script>
  const msgs=[
    ['Użytkownik','Dzień dobry'],
    ['Asystent','Dzień dobry. Witam w firmie "Szybki Serwis". Proszę o podanie swojego numeru klienta.'],
    ['Użytkownik','1337'],
    ['Asystent','Dziękujemy, Panie... (sprawdza bazę danych) ...Kowalskim. Czego potrzebuje dzisiaj? Problem z produktem?'],
    ['Użytkownik','Baza danych nie działa.'],
    ['Asystent','Przepraszam za niedogodność, Panie Kowalski. Baza danych nie działa całkowicie czy wystąpiły jakieś specyficzne błędy podczas jej działania?'],
    ['Użytkownik','Błąd połączenia z serwerem.'],
    ['Asystent','Czy mógłby Pan sprawdzić, czy połączenie z Internetem jest stabilne i czy inne aplikacje działają prawidłowo?'],
    ['Użytkownik','Internet działa'],
    ['Asystent','Dziękuję za potwierdzenie. W takim przypadku mogę zaproponować kilka kroków w celu rozwiązania problemu. Najpierw proszę o sprawdzenie, czy zostały zainstalowane najnowsze aktualizacje produktu. Następnie warto będzie wykonać restart serwera bazy danych. Czy Pan wie jak to zrobić?'],
    ['Użytkownik','Nie wiem'],
  ];
  const m=(x,c='')=>`<div class="m ${c}"><b>${x[0]}:</b> ${x[1]}</div>`;
  document.getElementById('a').innerHTML=`<div class="win">${msgs.slice(0,9).map(x=>m(x)).join('')}</div>`+m(msgs[9],'new');
  document.getElementById('b').innerHTML=msgs.slice(0,5).map(x=>m(x,'outside')).join('')+`<div class="win">${msgs.slice(5).map(x=>m(x)).join('')}</div>`;
</script>
</body>
</html>
