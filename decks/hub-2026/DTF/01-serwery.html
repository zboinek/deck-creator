<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Fabryka Tokenów: krok 1, serwery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="dtf.css" />
</head>
<body>

  <div class="top">
    <span class="brand">Fabryka <i>Tokenów</i></span>
    <span class="manual">Instrukcja montażu</span>
    <span class="rule"></span>
    <div class="pips"><span class="now">1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
  </div>

  <div class="left">
    <div class="step"><div class="no">1</div><div class="of">krok 1 z 5<br>blachy</div></div>
    <h1>Weź serwery<br><span class="h1s">od Dell Technologies.</span></h1>
    <p class="sub">I sprawdź, czy <b>gniazdko i klimatyzacja</b> to wytrzymają.</p>
    <div class="proof">
      <div class="v">14,3 kW</div>
      <div class="l">na <b>jeden</b> serwer z ośmioma kartami.</div>
    </div>
  </div>

  <svg class="art" viewBox="0 0 640 620">
    <defs>
      <g id="man" fill="#fff" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="0" cy="0" r="24"/>
        <path d="M-34 112 V64 Q-34 38 0 38 Q34 38 34 64 V112 Z"/>
        <path d="M-16 112 V190 M16 112 V190" fill="none"/>
      </g>
    </defs>

    <!-- lista części -->
    <text class="big" x="40" y="44">1 ×</text>
    <text class="lab dim" x="120" y="42">SERWER 4U</text>

    <!-- serwer, front z ośmioma kartami -->
    <rect class="kw" x="40" y="70" width="560" height="200" rx="10"/>
    <g class="k" style="stroke-width:4">
      <rect x="66"  y="96" width="50" height="118" rx="4"/>
      <rect x="130" y="96" width="50" height="118" rx="4"/>
      <rect x="194" y="96" width="50" height="118" rx="4"/>
      <rect x="258" y="96" width="50" height="118" rx="4"/>
      <rect x="322" y="96" width="50" height="118" rx="4"/>
      <rect x="386" y="96" width="50" height="118" rx="4"/>
      <rect x="450" y="96" width="50" height="118" rx="4"/>
      <rect x="514" y="96" width="50" height="118" rx="4"/>
    </g>
    <path class="k" d="M66 244 H200" style="stroke-width:4"/>
    <circle class="kf" cx="574" cy="244" r="7"/>

    <!-- kabel do gniazdka -->
    <path class="k" d="M470 270 C 470 350 390 350 390 420"/>
    <rect class="kw" x="330" y="420" width="120" height="120" rx="16"/>
    <circle class="kf" cx="370" cy="480" r="9"/>
    <circle class="kf" cx="410" cy="480" r="9"/>

    <!-- ostrzeżenie -->
    <polygon class="o" points="545,410 612,530 478,530" style="fill:#fff"/>
    <text class="big cg" x="534" y="512">!</text>
    <text class="lab cg" x="478" y="580">14,3 kW</text>

    <!-- ludzik drapie się po głowie -->
    <use href="#man" x="150" y="370"/>
    <path class="k" d="M184 430 Q214 380 180 350"/>
    <text class="big dim" x="92" y="336">?</text>
  </svg>

  <div class="foot">
    <div class="who"><img src="favicon.png" alt="" /><b>Comtegra GPU Cloud</b> · Pomożemy złożyć Twoją.</div>
    <div class="cta">Zapytaj na stoisku <i>→</i></div>
  </div>

</body>
</html>
