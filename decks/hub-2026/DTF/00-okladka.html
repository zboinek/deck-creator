<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Fabryka Tokenów: okładka</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="dtf.css" />
</head>
<body>

  <div class="top">
    <span class="brand">Fabryka <i>Tokenów</i></span>
    <span class="manual">Instrukcja montażu</span>
    <span class="rule"></span>
    <div class="pips"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
  </div>

  <div class="left">
    <div class="step"><div class="no">5</div><div class="of">kroków<br>zero abonamentów</div></div>
    <h1>Zbuduj sobie fabrykę tokenów.</h1>
    <p class="sub">Klucz imbusowy <b>w zestawie</b>. Śrubki zostaną, jak zawsze.</p>
    <div class="proof">
      <div class="v">10 mld</div>
      <div class="l">tokenów. Tyle przetworzyliśmy w <b>naszej fabryce</b> w ostatnim miesiącu.</div>
    </div>
  </div>

  <svg class="art" viewBox="0 0 640 620">
    <!-- karton: góra, lewa ściana, prawa ściana -->
    <polygon class="kw" points="300,110 530,215 300,320 70,215"/>
    <polygon class="kw" points="70,215 300,320 300,570 70,465"/>
    <polygon class="kw" points="300,320 530,215 530,465 300,570"/>
    <!-- taśma na wieku -->
    <path class="k" d="M185 162 L415 267"/>
    <!-- napis na lewej ścianie -->
    <g transform="matrix(1 0.4565 0 1 96 300)">
      <text class="big" x="0" y="0">FABRYKA</text>
      <text class="big cg" x="0" y="40">TOKENÓW</text>
      <text class="lab dim" x="0" y="96">1 × fabryka</text>
      <text class="lab dim" x="0" y="124">5 × krok</text>
    </g>
    <!-- prawa ściana: ludzik z instrukcji -->
    <g transform="matrix(1 -0.4565 0 1 318 440)">
      <circle cx="40" cy="-50" r="16" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>
      <path d="M18 30 V-8 Q18 -26 40 -26 Q62 -26 62 -8 V30 Z" fill="#fff" stroke="#0a0a0a" stroke-width="4" stroke-linejoin="round"/>
      <text class="lab" x="80" y="-20" style="font-size:17px">1 osoba</text>
      <text class="lab dim" x="80" y="6" style="font-size:17px">wystarczy</text>
    </g>
    <!-- klucz imbusowy -->
    <path d="M430 588 H598 V520" fill="none" stroke="rgb(235,123,22)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="foot">
    <div class="who"><img src="favicon.png" alt="" /><b>Comtegra GPU Cloud</b> · Pomożemy złożyć Twoją.</div>
    <div class="cta">Zapytaj na stoisku <i>→</i></div>
  </div>

</body>
</html>
