<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Fabryka Tokenów: gotowe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="dtf.css" />
</head>
<body>

  <div class="top">
    <span class="brand">Fabryka <i>Tokenów</i></span>
    <span class="manual">Instrukcja montażu</span>
    <span class="rule"></span>
    <div class="pips"><span class="done">1</span><span class="done">2</span><span class="done">3</span><span class="done">4</span><span class="done">5</span></div>
  </div>

  <div class="left">
    <div class="step"><div class="no">✓</div><div class="of">zmontowane<br>a teraz po co</div></div>
    <h1>Daj AI swoje tajne dane.</h1>
    <p class="sub">Umowy, wypłaty, kod, strategię. <b>Nic nie wychodzi poza serwerownię.</b></p>
    <div class="proof">
      <div class="v">0 bajtów</div>
      <div class="l">Twoich danych w cudzym API. <b>Po to</b> budujesz własną fabrykę.</div>
    </div>
  </div>

  <svg class="art" viewBox="0 0 640 620">
    <defs>
      <g id="man" fill="#fff" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="0" cy="0" r="24"/>
        <path d="M-34 112 V64 Q-34 38 0 38 Q34 38 34 64 V112 Z"/>
        <path d="M-16 112 V190 M16 112 V190" fill="none"/>
      </g>
    </defs>

    <defs>
      <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#b8b8be"/></marker>
    </defs>

    <!-- tokeny z komina: szare, bo tu chodzi o dane, nie o produkcję -->
    <g class="g" style="fill:#f1f1f3">
      <rect x="360" y="96" width="70" height="40" rx="10"/>
      <rect x="420" y="40" width="84" height="46" rx="11"/>
      <rect x="500" y="0"  width="100" height="52" rx="12"/>
    </g>
    <text class="dim" x="374" y="123" style="font-size:17px">tok</text>
    <text class="dim" x="440" y="71"  style="font-size:20px">tok</text>
    <text class="dim" x="524" y="35"  style="font-size:24px">tok</text>

    <!-- fabryka: dach szedowy, komin -->
    <rect class="kw" x="330" y="150" width="56" height="200"/>
    <path class="kw" d="M20 590 V310 L130 250 V310 L240 250 V310 L350 250 V310 H460 V590 Z"/>
    <g class="k" style="stroke-width:4">
      <rect x="50"  y="370" width="70" height="60" rx="3"/>
      <rect x="160" y="370" width="70" height="60" rx="3"/>
      <rect x="270" y="370" width="70" height="60" rx="3"/>
      <rect x="370" y="370" width="60" height="60" rx="3"/>
    </g>
    <rect class="kw" x="190" y="480" width="100" height="110"/>
    <path class="k" d="M240 480 V590"/>

    <!-- ludzik niesie teczkę TAJNE do fabryki -->
    <use href="#man" x="570" y="400"/>
    <path class="k" d="M604 460 L616 520"/>
    <path class="k" d="M536 460 L524 474"/>
    <path d="M470 440 H498 L506 452 H548 V512 H470 Z" fill="#fff" stroke="rgb(235,123,22)" stroke-width="5" stroke-linejoin="round"/>
    <text class="cg" x="509" y="484" text-anchor="middle" dominant-baseline="central"
          transform="rotate(-10 509 484)" style="font-size:17px">TAJNE</text>

    <!-- droga teczki: do środka, nie na zewnątrz -->
    <path class="g" d="M480 530 Q400 610 306 560" stroke-dasharray="8 8" marker-end="url(#ag)"/>
  </svg>

  <div class="foot">
    <div class="who"><img src="favicon.png" alt="" /><b>Comtegra GPU Cloud</b> · Pomożemy złożyć Twoją.</div>
    <div class="cta">Zapytaj na stoisku <i>→</i></div>
  </div>

</body>
</html>
