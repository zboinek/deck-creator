<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Struktura promptu i historia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="prompt-base.css" />
<style>
  /* 1200x900: slajd ma listę pojęć obok, obrazek idzie do kolumny */
  body { width: 1200px; height: 900px; padding: 56px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .col .hdr { margin-bottom: 26px; }
  .one { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .one .blk { height: 92px; font-size: 26px; }
  .one .blk.ctx { height: 168px; }
  .hist { display: flex; flex-direction: column; gap: 10px; }
  .hist .blk { height: 58px; font-size: 20px; padding-left: 26px; }
  .hist .blk.ctx { height: 84px; }
  .hist .turn { margin: 10px 0 0 2px; }
  .hist .turn:first-of-type { margin-top: 4px; }
  .hist .now { margin-top: 26px; display: flex; align-items: center; gap: 14px; font-size: 19px; color: var(--muted); }
  .hist .now .line { flex: 1; height: 2px; background: var(--grad-bar); }
</style>
</head>
<body>
  <div class="col">
    <div class="hdr">Jeden prompt</div>
    <div class="one">
      <div class="blk sys">System prompt</div>
      <div class="blk ins">User instruction</div>
      <div class="blk ctx">User context</div>
      <div class="blk ast">Assistant</div>
    </div>
  </div>
  <div class="col">
    <div class="hdr">Historia rozmowy</div>
    <div class="hist">
      <div class="blk sys">System prompt</div>
      <div class="turn">Tura 1</div>
      <div class="blk ins">User instruction</div>
      <div class="blk ctx">User context</div>
      <div class="blk ast">Assistant</div>
      <div class="turn">Tura 2</div>
      <div class="blk ins">User instruction</div>
      <div class="blk ast">Assistant</div>
      <div class="turn">Tura 3</div>
      <div class="blk ins">User instruction</div>
      <div class="now"><span class="line"></span><span>całość idzie do modelu</span></div>
    </div>
  </div>
</body>
</html>
