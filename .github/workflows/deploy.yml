name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build, scan & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gate na podatnosciach zaleznosci JS - szybki fail zanim ruszy docker build.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skan obrazu (Alpine OS + node_modules w standalone build).
      # Deploy (job nizej) nie ruszy, jesli trivy znajdzie HIGH/CRITICAL.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  deploy:
    name: Sync decks & restart
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host deck-server
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config

      # Mirror repo decks/ onto the server (removes stale files and raw materials).
      - name: Sync decks
        run: rsync -az --delete decks/ deck-server:apps/deck-creator/decks/

      # Pakiet prywatny: logujemy serwer tokenem tego joba (wazny ~1 h)
      # tuż przed pullem - na serwerze nie zostaje trwaly token rejestru.
      - name: Log server in to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh deck-server 'docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin >/dev/null'

      - name: Pull image and restart container
        run: |
          ssh deck-server 'cd apps && docker compose pull deck-creator && docker compose rm -sf deck-creator && docker compose up -d deck-creator'

      - name: Verify
        run: |
          ssh deck-server 'code=$(curl -s -o /dev/null -w %{http_code} http://localhost:3000/); echo "deck-creator HTTP $code"; test "$code" = 200'
